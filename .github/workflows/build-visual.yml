name: Validate and render quantum field notes
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packages
        run: python -m pip install -r requirements.txt
      - name: Validate Bell-state mathematics
        run: python -m unittest discover -s tests -v
      - name: Render PNG and SVG
        run: python -m src.render_post
      - name: Commit generated figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bell_state_post.png assets/bell_state_post.svg
          if ! git diff --cached --quiet; then
            git commit -m "Add generated Bell-state figure"
            git push
          fi
